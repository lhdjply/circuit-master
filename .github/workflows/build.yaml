name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # 仓库名（小写，用于 deb / 产物命名）；可执行文件名是 CMake 里的 target 名
  APP_NAME: circuit-master
  BINARY: CircuitMaster

jobs:
  build:
    name: Build (Linux)
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system Qt and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            cmake \
            ninja-build \
            g++ \
            pkg-config \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-charts-dev \
            qt6-svg-dev

      - name: Print the Qt version in use
        run: |
          # 把版本打出来，便于对照「本地 6.8.0 上能过、CI 上为什么不行」
          pkg-config --modversion Qt6Core
          dpkg-query -W -f='${Package} ${Version}\n' \
            qt6-base-dev qt6-charts-dev qt6-svg-dev

      - name: Verify Qt version
        run: |
          version=$(pkg-config --modversion Qt6Core)
          # CMakeLists 里要求 Qt 6.5+。发行版 Qt 太旧时在这里明确失败，
          # 否则报出来的会是 "no member named ..."，看起来像代码写错了。
          major=${version%%.*}
          rest=${version#*.}
          minor=${rest%%.*}
          if [ "$major" -lt 6 ] || { [ "$major" -eq 6 ] && [ "$minor" -lt 5 ]; }; then
            echo "::error::Qt >= 6.5 is required, found $version."
            exit 1
          fi

          # QtCharts 是单独模块，缺了会在链接阶段才报错，这里先确认 pkg-config 能查到
          if ! pkg-config --exists Qt6Charts; then
            echo "::error::Qt6Charts was not found; install qt6-charts-dev"
            exit 1
          fi
          echo "Qt6Charts $(pkg-config --modversion Qt6Charts)"

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCSM_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Verify the produced executable
        run: |
          if [ ! -x "build/${BINARY}" ]; then
            echo "::error::build/${BINARY} was not produced"
            exit 1
          fi
          # 版本号来自根目录 VERSION 文件，产物上对一下
          ./build/${BINARY} --version

  # Windows 走 MSYS2 / MinGW（UCRT64），而不是 MSVC + install-qt-action：
  #   * 一次装齐 Qt6 的 Base / Charts / Svg 三个模块与 Ninja，不必为 CI
  #     下载约 1GB 的 Qt 安装包；
  #   * 这个作业的价值在于让代码在 MinGW 工具链下真的被编译器过一遍——
  #     Linux 上发现不了的 MinGW 专属问题（头文件差异、类型宽度、链接行为）
  #     在这里暴露。
  build-windows:
    name: Build (Windows / MinGW)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # action 只负责把 MSYS2 装起来。它的 update: true 是用一条 pacman 命令跑完
      # 上千个包，任何一次镜像限速都让整步失败且无法重试。升级与装包放到下一步
      # 自己做：可以在命令外加重试，并带上 --disable-download-timeout 关掉
      # libcurl 的低速中断。
      - name: Install MSYS2 (base only)
        uses: msys2/setup-msys2@v2
        with:
          msystem: ucrt64
          update: false
          cache: true

      # msys2-runtime 的升级会让 pacman 终止所有 MSYS2 进程——包括执行它的这个
      # shell，所以本步骤可能以 exit 1 结束。这不是失败：包已经装好并入库，只是
      # shell 连同尚未执行的命令一起没了。用 continue-on-error 放过它，真正的判据
      # 放在下一步：新 shell 里幂等补完升级与装包，再逐个确认工具能跑。
      - name: Upgrade the MSYS2 core
        continue-on-error: true
        run: |
          set -euo pipefail

          retry() {
            local attempt
            for attempt in 1 2 3; do
              echo "--- attempt $attempt: $*"
              if "$@"; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "::warning::attempt $attempt failed; retrying in 10s"
                sleep 10
              fi
            done
            echo "::error::giving up after 3 attempts: $*"
            return 1
          }

          # MSYS2 不支持部分升级：运行时与库必须同版本，装包前先整系统升到最新。
          # 这里的失败不判死（镜像抖动很常见），下一步会以硬失败的标准重试一次。
          retry pacman -Syu --noconfirm --needed --disable-download-timeout \
            || echo "::warning::the core upgrade did not complete; the next step retries it"

      - name: Install the toolchain
        run: |
          set -euo pipefail

          retry() {
            local attempt
            for attempt in 1 2 3; do
              echo "--- attempt $attempt: $*"
              if "$@"; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "::warning::attempt $attempt failed; retrying in 10s"
                sleep 10
              fi
            done
            echo "::error::giving up after 3 attempts: $*"
            return 1
          }

          # 上一步若被 msys2-runtime 的替换打断，这里在新 shell 里把剩余部分补完；
          # 系统已经是最新时，这条只会打印 "there is nothing to do"
          retry pacman -Syu --noconfirm --needed --disable-download-timeout

          # 直接点名 mingw-w64-<env>-<arch>-*，不用 pacboy 的 :p 后缀：pacboy 来自
          # pactoys 包，不保证在 update: false 的基础安装里已经存在。
          # qt6-charts 是独立包，缺了会在链接阶段才报错。
          retry pacman -S --noconfirm --needed --disable-download-timeout \
            mingw-w64-ucrt-x86_64-cmake \
            mingw-w64-ucrt-x86_64-ninja \
            mingw-w64-ucrt-x86_64-gcc \
            mingw-w64-ucrt-x86_64-binutils \
            mingw-w64-ucrt-x86_64-pkgconf \
            mingw-w64-ucrt-x86_64-qt6-base \
            mingw-w64-ucrt-x86_64-qt6-charts \
            mingw-w64-ucrt-x86_64-qt6-svg \
            mingw-w64-ucrt-x86_64-qt6-translations

          # 以「工具真的能跑」为准：上一步的退出码既可能来自成功，也可能来自被
          # 中断，唯一可靠的判据是命令存不存在
          missing=0
          for tool in cmake ninja pkgconf gcc; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "ok: $tool -> $(command -v "$tool")"
            else
              echo "::error::$tool is missing after the package installation"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Print the toolchain versions
        run: |
          # Windows 作业统一用 gcc（UCRT64），没有 g++ 别名歧义；仍按包名核对
          gcc --version | head -1
          cmake --version | head -1
          echo "Qt6Core $(pkg-config --modversion Qt6Core)"
          echo "Qt6Charts $(pkg-config --modversion Qt6Charts)"

      - name: Verify Qt version
        run: |
          version=$(pkg-config --modversion Qt6Core)
          echo "Qt6Core $version"

          # 与 Linux 作业同一套判定：CMakeLists 里要求 Qt 6.5+。
          # MSYS2 的 qt6-base 当前远新于 6.5，正常不会触发；保留这个检查是为了
          # 镜像里 Qt 被降级时能给出明确原因。
          major=${version%%.*}
          rest=${version#*.}
          minor=${rest%%.*}
          if [ "$major" -lt 6 ] || { [ "$major" -eq 6 ] && [ "$minor" -lt 5 ]; }; then
            echo "::error::Qt >= 6.5 is required, found $version."
            exit 1
          fi

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCSM_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --parallel

      # 构建成功不代表产物是一个 Windows 应用：主程序是 WIN32_EXECUTABLE，
      # 这里确认产物带 GUI 子系统，避免退化成控制台程序还静默通过。
      # 注意：GUI 子系统程序不会把 stdout 接到 MSYS2 终端，所以不在这里跑
      # --version，改由子系统字段判断。
      - name: Verify the produced executable
        run: |
          exe=build/${BINARY}.exe
          if [ ! -f "$exe" ]; then
            echo "::error::$exe was not produced"
            exit 1
          fi

          # objdump 随 gcc 一起装好（binutils），比手工按 PE 头偏移取字段可靠
          subsystem=$(objdump -p "$exe" | awk '/^Subsystem/ {print $2; exit}')
          echo "subsystem=$subsystem"
          # 2 = Windows GUI，3 = Windows Console（十六进制 00000002 / 00000003）
          case "$subsystem" in
            00000002|2)
              echo "OK: GUI subsystem"
              ;;
            *)
              echo "::error::${BINARY}.exe is not a GUI-subsystem binary (subsystem=$subsystem)"
              exit 1
              ;;
          esac

  # macOS 同样走包管理器（Homebrew 的 qt 公式），理由见 test.yaml 里的同名作业。
  # 这里只验证「能不能编出来」，不做打包 —— 打包在 release.yaml 里。
  build-macos:
    name: Build (macOS)
    runs-on: macos-26-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Qt
        run: |
          brew install qt
          prefix="$(brew --prefix qt)"
          echo "QT_PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "$prefix/bin" >> "$GITHUB_PATH"

      - name: Verify Qt version
        run: |
          if command -v qmake >/dev/null 2>&1; then
            version="$(qmake -query QT_VERSION)"
          else
            version="$(qmake6 -query QT_VERSION)"
          fi
          echo "Qt $version（$QT_PREFIX）"
          major=${version%%.*}
          rest=${version#*.}
          minor=${rest%%.*}
          if [ "$major" -lt 6 ] || { [ "$major" -eq 6 ] && [ "$minor" -lt 5 ]; }; then
            echo "::error::Qt >= 6.5 is required, found $version."
            exit 1
          fi

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCSM_BUILD_TESTS=OFF
          -DCMAKE_PREFIX_PATH="$QT_PREFIX"

      - name: Build
        run: cmake --build build --parallel

      - name: Verify the produced executable
        run: |
          # MACOSX_BUNDLE 打开后产物在 .app 里，不是 build/ 下的裸可执行文件
          exe="build/${BINARY}.app/Contents/MacOS/${BINARY}"
          if [ ! -x "$exe" ]; then
            echo "::error::$exe was not produced"
            find build -maxdepth 4 -name "$BINARY*" -print
            exit 1
          fi
          # 版本号来自根目录 VERSION 文件，产物上对一下
          "$exe" --version

  # Android：只验证「能不能编出一个 APK」，不做发布。
  #
  # Qt 的 Android 包由 jurplel/install-qt-action 提供（目标 android + 架构
  # android_arm64_v8a），SDK 与 NDK 由 android-actions/setup-android 装。
  # 交叉编译要三样东西：Android 用的 Qt、**宿主**用的 Qt（moc/rcc 在那里面，
  # 由 QT_HOST_PATH 指出）、以及 NDK。
  #
  # 这一条作业只覆盖「能编译、能打包」；真机上的触摸交互是后面的事。
  build-android:
    name: Build (Android)
    runs-on: ubuntu-26.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Qt 6.8+ 的 Android 打包要 JDK 17（Gradle 8）
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不装 android-actions/setup-android：它内部会跑 `sdkmanager tools`，
      # 而 "tools" 这个包早已从 Google 的仓库里移除，整条流水线会卡在
      # "Warning: Failed to find package 'tools'" 然后失败退出。
      # GitHub 的 ubuntu 镜像本来就预装了 Android SDK，直接用即可。
      - name: Set up the Android SDK and NDK
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"

          sdkmanager=$(command -v sdkmanager || true)
          if [ -z "$sdkmanager" ]; then
            sdkmanager=$(find "$sdk" -maxdepth 5 -name sdkmanager -type f -print -quit)
          fi
          if [ -z "$sdkmanager" ]; then
            echo "::error::没有找到 sdkmanager"
            exit 1
          fi
          echo "sdkmanager=$sdkmanager"

          # 接受许可：镜像里已接受一部分，剩下的在这里补。
          # yes 会被 sdkmanager 提前关管道打成 SIGPIPE，所以容错。
          yes | "$sdkmanager" --licenses > /dev/null || true

          # NDK：优先 r26b（Qt 6.10 文档推荐的组合）；万一仓库里没有，
          # 退到能拿到的最新 26.x / 27.x，避免整条流水线因为一个小版本号挂掉
          version=26.1.10909125
          if ! "$sdkmanager" --install "ndk;$version" > /dev/null 2>&1; then
            echo "ndk;$version 装不上，改挑仓库里最新的 26.x / 27.x"
            version=$("$sdkmanager" --list 2>/dev/null \
              | sed -n 's/^ *ndk;\(2[67]\.[0-9.]*\).*/\1/p' | sort -V | tail -1)
            if [ -z "$version" ]; then
              echo "::error::仓库里找不到可用的 NDK"
              exit 1
            fi
            "$sdkmanager" --install "ndk;$version" > /dev/null
          fi
          echo "选中 NDK $version"
          echo "ANDROID_NDK_ROOT=$sdk/ndk/$version" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$sdk/ndk/$version" >> "$GITHUB_ENV"

          # ---- 平台：固定到 34 ----
          # androiddeployqt 会自己挑 SDK 里**最高**的平台当 compileSdk。
          # 镜像里预装了更新的平台，其中 android-36-ext19 是预览版：
          #   aapt2 E RES_TABLE_TYPE_TYPE entry offsets overlap actual entry data.
          #   error: failed to load include path .../android-36-ext19/android.jar
          # 那是新版 aapt2 编出来的资源表，AGP 7.4.1 自带的老 aapt2 读不了
          #（Qt 6.7 用的就是 AGP 7.4.1 / Gradle 8.3）。
          # 装一个稳定的 34（和 Qt 6.7 默认的 targetSdk 一致），再把更高版本
          # 和预览版平台删掉，让它只能选到这个。
          "$sdkmanager" --install "platforms;android-34" > /dev/null
          find "$sdk/platforms" -mindepth 1 -maxdepth 1 -type d \
            \( -name 'android-3[5-9]*' -o -name '*-ext*' -o -name '*-preview*' \) \
            -exec rm -rf {} +
          echo "剩余平台："
          ls "$sdk/platforms"

      - name: Install Qt for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: linux
          target: android
          arch: android_arm64_v8a
          modules: 'qtcharts'
          cache: true

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build

      - name: Print the toolchain in use
        run: |
          echo "QT_ROOT_DIR=$QT_ROOT_DIR"
          echo "QT_HOST_PATH=$QT_HOST_PATH"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
          ls "$QT_ROOT_DIR/lib/cmake/Qt6/qt.toolchain.cmake"
          ls "$QT_ROOT_DIR/bin/qt-cmake"

      - name: Configure
        run: |
          set -euo pipefail
          # 用 Qt 自带的 qt-cmake 包装器：它会自己指定交叉编译用的 toolchain
          # 文件和宿主 Qt（moc/rcc 在宿主那边），比手工拼 -DCMAKE_TOOLCHAIN_FILE
          # 和 -DQT_HOST_PATH 少一处容易写错的地方
          # NDK r26 的 toolchain 文件里 cmake_minimum_required 写的老版本号，
          # 在 CMake 4.x 下每个探测步骤都会刷一遍弃用警告，日志完全被淹没。
          # 这条只压「弃用」这一类，我们自己的编译警告照常显示。
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build-android -G Ninja -Wno-deprecated \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-23 \
            -DCSM_BUILD_TESTS=OFF

      - name: Build the APK
        run: |
          set -euo pipefail
          # 默认目标只编出 libCircuitMaster_arm64-v8a.so；
          # APK 是单独的 apk 目标（内部跑 androiddeployqt + Gradle）
          cmake --build build-android --parallel
          cmake --build build-android --target apk --parallel

      # 签名。release 构建默认出的是**未签名** APK，Android 会直接拒绝安装
      #（"该安装包未包含任何证书"）。这里用仓库里的密钥签：
      #   resources/android/sideload.keystore，别名 circuit-master
      # 口令写在下面 —— 这把密钥是**公开**的，只适合自发分发（侧载）：
      # 谁拿到仓库都能用同一身份签名。要正式分发请换成自己的密钥，
      # 并用 secrets 传进来（换了密钥之后用户需要卸载重装一次）。
      # 这个作业只验证「编得出来、签得上」，所以原地替换 build-android 里的那个。
      - name: Sign the APK
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          tools=$(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          zipalign="$tools/zipalign"
          apksigner="$tools/apksigner"
          if [ ! -x "$apksigner" ]; then
            echo "::error::apksigner not found under $tools"
            exit 1
          fi

          apk=$(find build-android -name '*.apk' -print -quit)
          if [ -z "$apk" ]; then
            echo "::error::no APK was produced"
            exit 1
          fi

          # zipalign 必须在校名前做，apksigner 之后不能再改文件
          "$zipalign" -p -f 4 "$apk" "$apk.aligned"
          "$apksigner" sign --ks resources/android/sideload.keystore \
            --ks-pass "pass:circuitmaster" --ks-key-alias circuit-master \
            --key-pass "pass:circuitmaster" --out "$apk" "$apk.aligned"
          rm -f "$apk.aligned"
          "$apksigner" verify --print-certs "$apk"

      - name: Verify the APK
        run: |
          set -euo pipefail
          # 用 -print -quit 而不是管道接 head：pipefail 下 head 提前关管道会让
          # find 吃到 SIGPIPE，set -e 直接中断脚本
          apk=$(find build-android -name '*.apk' -print -quit)
          if [ -z "$apk" ]; then
            echo "::error::no APK was produced"
            find build-android -maxdepth 4 \( -name '*.json' -o -name '*.gradle' \) | head
            exit 1
          fi
          size=$(stat -c%s "$apk")
          echo "$apk  ($((size / 1024 / 1024)) MiB)"
          # Qt 运行库加上我们自己的代码，arm64 单架构不可能小到 10 MiB 以下；
          # 太小说明打包时漏了 Qt 库，装到手机上会起不来
          if [ "$size" -lt 10485760 ]; then
            echo "::error::APK is suspiciously small ($size bytes)"
            exit 1
          fi
          # 清单里的包名和版本号要跟 VERSION 对得上
          aapt2=$(find "$ANDROID_SDK_ROOT/build-tools" -name aapt2 | sort | tail -1)
          "$aapt2" dump badging "$apk" | head -3
