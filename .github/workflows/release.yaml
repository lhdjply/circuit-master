name: Release

on:
  push:
    branches: ['*']
    tags: ['*']
  pull_request:
    branches: ['*']
  workflow_dispatch:

# gh release create/upload 需要写权限；仓库默认 token 可能只有读
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: "circuit-master"
  BINARY: "CircuitMaster"
  BUILD_TYPE: "Release"

jobs:
  build-deb:
    name: Package (Linux ${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # runner 按架构分两类：amd64 用 x86_64 宿主，其余三个架构用 arm64 宿主，
          # 目标架构与宿主不同时靠 QEMU 仿真执行容器。
          - platform: amd64
            runner: ubuntu-26.04
            image: linuxdeepin/deepin:crimson
          - platform: arm64
            runner: ubuntu-26.04-arm
            image: linuxdeepin/deepin:crimson-arm64
          - platform: loong64
            runner: ubuntu-26.04-arm
            image: linuxdeepin/deepin:crimson-loong64
          - platform: riscv64
            runner: ubuntu-26.04-arm
            image: linuxdeepin/deepin:crimson-riscv64
    steps:
      - name: Install QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: ${{ matrix.platform }}

      - name: Install Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Checkout
        uses: actions/checkout@v6

      - name: Build ${{ matrix.platform }} package
        run: |
          docker run --rm --platform linux/${{ matrix.platform }} -v ${{ github.workspace }}:/workspace \
            ${{ matrix.image }} \
            bash -c "
            set -e
            cd /workspace &&
            Jobs=\$(nproc) &&
            echo \"CPUs in container: \$Jobs\" &&
            apt update &&
            apt install -y build-essential devscripts dh-make equivs &&
            mk-build-deps -i -t 'apt-get -y' './debian/control' &&
            DEB_BUILD_OPTIONS=\"parallel=\$Jobs\" debuild -us -uc -b &&
            cp ../*.deb ./ &&
            { bash scripts/package-linux-tarball.sh --arch ${{ matrix.platform }} --from-deb \$(ls circuit-master_*.deb | head -1) || echo \"::warning::packaging the Linux tarball failed; the deb is still published\"; }
            "

      # -b：debian/source/format 是 3.0 (native)，加 -b 只是跳过源码包。
      # parallel=N：debuild 不带 -j 是单线程；不能写成不带数字的 --parallel，
      #   Make 生成器会翻成 `make -j`（无限并发），容器直接卡死。

      - name: Collect deb packages
        run: |
          if ls ./*dbgsym*.deb 1> /dev/null 2>&1; then
            rm ./*dbgsym*.deb
          fi
          if ls ./*build-deps*.deb 1> /dev/null 2>&1; then
            rm ./*build-deps*.deb
          fi

          mkdir -p deb_package
          cp ./*.deb deb_package
          ls -l deb_package

      - name: Upload deb artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}_linux_deb_${{ matrix.platform }}
          path: deb_package/*.deb
          if-no-files-found: error

      - name: Upload Linux tarball
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}_linux_tarball_${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: warn


  build-windows:
    name: Package (Windows ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            msystem: ucrt64
            compiler: gcc
            # pacman 里的包名前缀（等于 MSYS2 环境名 + 目标三元组简写）
            mingw_prefix: mingw-w64-ucrt-x86_64
            arch: x64
            # Inno Setup 的目标架构约束值（6.3+ 才有 x64compatible）
            arch_allowed: x64compatible
          - os: windows-11-arm
            msystem: clangarm64
            compiler: clang
            mingw_prefix: mingw-w64-clang-aarch64
            arch: arm64
            arch_allowed: arm64
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # action 只负责把 MSYS2 装起来。它的 update: true 是用一条 pacman 命令跑完
      # 上千个包，任何一次镜像限速都让整步失败且无法重试——arm64 上就挂在
      # harfbuzz 的 .sig 上（Operation too slow, Less than 1 bytes/sec）。升级与装包
      # 放到下一步自己做：可以在命令外加重试，并带上 --disable-download-timeout
      # 关掉 libcurl 的低速中断。
      - name: Install MSYS2 (base only)
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          cache: true

      # msys2-runtime 的升级会让 pacman 终止所有 MSYS2 进程——包括执行它的这个
      # shell，所以本步骤可能以 exit 1 结束。这不是失败：包已经装好并入库，只是
      # shell 连同尚未执行的命令一起没了。用 continue-on-error 放过它，真正的判据
      # 放在下一步：新 shell 里幂等补完升级与装包，再逐个确认工具能跑。
      - name: Upgrade the MSYS2 core
        continue-on-error: true
        run: |
          set -euo pipefail

          retry() {
            local attempt
            for attempt in 1 2 3; do
              echo "--- attempt $attempt: $*"
              if "$@"; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "::warning::attempt $attempt failed; retrying in 10s"
                sleep 10
              fi
            done
            echo "::error::giving up after 3 attempts: $*"
            return 1
          }

          # MSYS2 不支持部分升级：运行时与库必须同版本，装包前先整系统升到最新。
          # 这里的失败不判死（镜像抖动很常见），下一步会以硬失败的标准重试一次。
          retry pacman -Syu --noconfirm --needed --disable-download-timeout \
            || echo "::warning::the core upgrade did not complete; the next step retries it"

      - name: Install the toolchain
        run: |
          set -euo pipefail

          retry() {
            local attempt
            for attempt in 1 2 3; do
              echo "--- attempt $attempt: $*"
              if "$@"; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "::warning::attempt $attempt failed; retrying in 10s"
                sleep 10
              fi
            done
            echo "::error::giving up after 3 attempts: $*"
            return 1
          }

          # 上一步若被 msys2-runtime 的替换打断，这里在新 shell 里把剩余部分补完；
          # 系统已经是最新时，这条只会打印 "there is nothing to do"
          retry pacman -Syu --noconfirm --needed --disable-download-timeout

          retry pacman -S --noconfirm --needed --disable-download-timeout \
            "${{ matrix.mingw_prefix }}-cmake" \
            "${{ matrix.mingw_prefix }}-ninja" \
            "${{ matrix.mingw_prefix }}-${{ matrix.compiler }}" \
            "${{ matrix.mingw_prefix }}-binutils" \
            "${{ matrix.mingw_prefix }}-pkgconf" \
            "${{ matrix.mingw_prefix }}-qt6-base" \
            "${{ matrix.mingw_prefix }}-qt6-charts" \
            "${{ matrix.mingw_prefix }}-qt6-svg" \
            "${{ matrix.mingw_prefix }}-qt6-translations"

          # 以「工具真的能跑」为准：上一步的退出码既可能来自成功，也可能来自被
          # 中断，唯一可靠的判据是命令存不存在
          missing=0
          for tool in cmake ninja pkgconf "${{ matrix.compiler }}"; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "ok: $tool -> $(command -v "$tool")"
            else
              echo "::error::$tool is missing after the package installation"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Print the toolchain versions
        run: |
          # x64 的编译器是 gcc，arm64 的 clang 没有可执行的 g++（别名都不存在）；
          # 按矩阵取编译器名，别写死
          "${{ matrix.compiler }}" --version | head -1
          cmake --version | head -1
          echo "Qt6Core $(pkg-config --modversion Qt6Core)"

      - name: Verify Qt version
        run: |
          version=$(pkg-config --modversion Qt6Core)
          echo "Qt6Core $version"

          # 与 Linux 作业同一套判定：CMakeLists 里要求 Qt 6.5+。
          # MSYS2 的 qt6-base 当前远新于 6.5，正常不会触发；保留这个检查是为了
          # 镜像里 Qt 被降级时能给出明确原因。
          major=${version%%.*}
          rest=${version#*.}
          minor=${rest%%.*}
          if [ "$major" -lt 6 ] || { [ "$major" -eq 6 ] && [ "$minor" -lt 5 ]; }; then
            echo "::error::Qt >= 6.5 is required, found $version."
            exit 1
          fi

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCSM_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --parallel

      # 构建成功不代表产物是一个 Windows 应用：主程序是 WIN32_EXECUTABLE，
      # 这里确认产物带 GUI 子系统，避免退化成控制台程序还静默通过。
      - name: Verify the produced executable
        run: |
          exe=build/CircuitMaster.exe
          if [ ! -f "$exe" ]; then
            echo "::error::$exe was not produced"
            exit 1
          fi

          # objdump 随 gcc 一起装好（binutils），比手工按 PE 头偏移取字段可靠
          subsystem=$(objdump -p "$exe" | awk '/^Subsystem/ {print $2; exit}')
          echo "subsystem=$subsystem"
          # 2 = Windows GUI，3 = Windows Console（十六进制 00000002 / 00000003）
          case "$subsystem" in
            00000002|2)
              echo "OK: GUI subsystem"
              ;;
            *)
              echo "::error::CircuitMaster.exe is not a GUI-subsystem binary (subsystem=$subsystem)"
              exit 1
              ;;
          esac

      # 解压后是一个可直接运行的目录：只放 exe 与许可证类文本，
      # Qt 运行时由下一步的 windeployqt 填进来。
      - name: Stage the package
        run: |
          set -euo pipefail
          version=$(sed 's/^[vV]//' VERSION | tr -d '[:space:]')
          stage="dist/circuit-master-${version}-windows-${{ matrix.arch }}"
          mkdir -p "$stage"

          cp build/CircuitMaster.exe "$stage/"
          cp README.md "$stage/README.md"
          cp CHANGELOG.md "$stage/CHANGELOG.md"
          cp LICENSE "$stage/LICENSE"

          echo "STAGE=$stage" >> "$GITHUB_ENV"
          echo "PKG_VERSION=$version" >> "$GITHUB_ENV"

      - name: Deploy the Qt runtime (windeployqt)
        run: |
          set -euo pipefail
          # 工具名在 Qt 6.7+ 上游与 MSYS2 打包之间不统一（windeployqt / windeployqt6），
          # 按实际存在的那个取，不把名字写死
          deploy=$(ls "$MINGW_PREFIX"/bin/windeployqt*.exe 2>/dev/null | head -1)
          if [ -z "$deploy" ]; then
            deploy=$(find "$MINGW_PREFIX" -maxdepth 3 -name 'windeployqt*.exe' | head -1)
          fi
          if [ -z "$deploy" ]; then
            echo "::error::windeployqt not found under $MINGW_PREFIX"
            exit 1
          fi
          echo "using $deploy"

          # --release            Release 构建，让工具按 release 版 Qt 收集依赖
          # --compiler-runtime   带上 libstdc++ / libgcc / libwinpthread：
          #                      目标机没有 MSYS2，缺一个就是双击没反应
          # --no-opengl-sw       不发 ~20MB 的软件光栅化器，纯 Widgets 用不到
          # 翻译不走 --translations：windeployqt 会用 lconvert 把各个 .qm
          # 合并成 qt_zh_CN.qm，而 MSYS2 里没有 lconvert，这一步直接以
          # 「Creating qt_zh_CN.qm…」失败退出。只把真正需要的
          # qtbase_zh_CN.qm 复制进去即可——程序启动时找的就是这个名字。
          "$deploy" --release --compiler-runtime \
                    --no-opengl-sw --no-translations \
                    --dir "$STAGE" "$STAGE/CircuitMaster.exe"

          # 翻译文件的位置在不同 Qt 打包里略有差别，按常见位置依次找
          qm=""
          for candidate in \
            "$MINGW_PREFIX/share/qt6/translations/qtbase_zh_CN.qm" \
            "$MINGW_PREFIX/share/qt/translations/qtbase_zh_CN.qm" \
            "$("$MINGW_PREFIX/bin/qmake" -query QT_INSTALL_TRANSLATIONS 2>/dev/null)/qtbase_zh_CN.qm"; do
            if [ -f "$candidate" ]; then
              qm="$candidate"
              break
            fi
          done
          if [ -z "$qm" ]; then
            echo "::error::qtbase_zh_CN.qm not found; is qt6-translations installed?"
            find "$MINGW_PREFIX" -name 'qtbase_zh_CN.qm' 2>/dev/null | head -5
            exit 1
          fi
          echo "using $qm"
          mkdir -p "$STAGE/translations"
          cp "$qm" "$STAGE/translations/"
          ls -l "$STAGE/translations"

      # 补齐后还缺的：lib* / Qt6* 只可能来自 MSYS2，缺了就是把包打漏了，
      # 目标机没有 MSYS2，双击就是没反应——直接不发这个包。
      # 其余（KERNEL32.dll、api-ms-win-* 之类）由 Windows 自带，列出来备查。
      #
      # objdump 的可用性：x64 的随 gcc（binutils）一起装好；arm64 的 clang 不带
      # binutils，包列表里已单独点名。输出格式与 GNU 有出入时，「导入表解析为空」
      # 的检查会在第一时间报出来。
      - name: Complete the runtime (transitive DLLs)
        run: |
          set -euo pipefail

          # 依赖闭包读 PE 导入表，不用 ldd：ldd 会把 PE 真的加载一遍，结果随
          # PATH 里先出现的同名 DLL 变化；objdump -p 只解析头。
          if ! command -v objdump >/dev/null 2>&1; then
            echo "::error::objdump not found; the dependency closure cannot be computed"
            exit 1
          fi

          imports() {
            objdump -p "$@" 2>/dev/null | awk '/DLL Name:/ {print $3}' | sort -u
          }

          # 解析器读不出导入表时，闭包会「一个都不缺」地通过，最后发出去的包少一堆
          # DLL 却没人拦——这类静默失败必须在源头挡住。
          if [ -z "$(imports "$STAGE/CircuitMaster.exe")" ]; then
            echo "::error::no imports could be parsed from CircuitMaster.exe; objdump output format not recognised"
            objdump -p "$STAGE/CircuitMaster.exe" | head -20
            exit 1
          fi

          # 反复补：每补进一个 DLL，它自己的依赖就会出现在下一轮里。
          max_rounds=20
          round=0
          while :; do
            round=$((round + 1))
            if [ "$round" -gt "$max_rounds" ]; then
              echo "::error::dependency closure did not converge after $max_rounds rounds"
              exit 1
            fi

            added=0
            while read -r name; do
              [ -n "$name" ] || continue
              if [ -e "$STAGE/$name" ]; then
                continue
              fi
              if [ -e "$MINGW_PREFIX/bin/$name" ]; then
                cp "$MINGW_PREFIX/bin/$name" "$STAGE/"
                echo "  + $name"
                added=$((added + 1))
              fi
            done < <(imports "$STAGE"/*.exe "$STAGE"/*.dll)

            echo "round $round: added $added"
            if [ "$added" -eq 0 ]; then
              break
            fi
          done

          # 补齐后还缺的：lib* / Qt6* 只可能来自 MSYS2，缺了就是把包打漏了，
          # 目标机没有 MSYS2，双击就是没反应——直接不发这个包。
          # 其余（KERNEL32.dll、api-ms-win-* 之类）由 Windows 自带，列出来备查。
          missing=0
          for name in $(imports "$STAGE"/*.exe "$STAGE"/*.dll); do
            if [ -e "$STAGE/$name" ]; then
              continue
            fi
            case "$name" in
              lib*|Qt6*)
                if [ -e "$MINGW_PREFIX/bin/$name" ]; then
                  echo "::error::$name is imported but was not staged (it exists in $MINGW_PREFIX/bin)"
                else
                  echo "::error::$name is imported but missing from both the package and $MINGW_PREFIX/bin"
                fi
                missing=$((missing + 1))
                ;;
              *)
                echo "  (system) $name"
                ;;
            esac
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "--- staged files ---"
          ls -1 "$STAGE" | head -50

          # 中文翻译必须真的在包里：漏了不会让程序起不来，只会让右键菜单、
          # 标准按钮退回英文，属于「构建全绿但功能缺失」，必须显式检查。
          if [ ! -f "$STAGE/translations/qtbase_zh_CN.qm" ]; then
            echo "::error::translations/qtbase_zh_CN.qm is missing from the package"
            exit 1
          fi
          echo "ok: translations/qtbase_zh_CN.qm"

      # Qt 的图像与平台插件按子目录加载，zip 里保留目录结构；
      # 纯 Widgets + SVG 应用不需要额外补 OpenSSL 之类的三方 DLL。
      - name: Pack the zip
        run: |
          set -euo pipefail
          version=$(sed 's/^[vV]//' VERSION | tr -d '[:space:]')
          name="circuit-master-${version}-windows-${{ matrix.arch }}.zip"
          cd dist
          # zip 里的顶层目录名保持与包名一致，解压即是一个完整目录
          powershell -NoProfile -Command "Compress-Archive -Path 'circuit-master-${version}-windows-${{ matrix.arch }}' -DestinationPath '${name}' -Force"
          cd ..
          ls -lh "dist/${name}"
          if [ "$(stat -c%s "dist/${name}")" -lt 5242880 ]; then
            echo "::error::the zip looks too small; Qt runtime was probably not deployed"
            exit 1
          fi

      - name: Upload Windows zip
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}_windows_${{ matrix.arch }}_portable
          path: dist/*.zip
          if-no-files-found: error

      # Inno Setup 安装包：给不想解压的普通用户一个双击安装的入口。
      # ISCC 通过 choco 安装；脚本由 msys2 shell 写出、Windows 侧执行，
      # 路径统一用正斜杠，Inno 两种都认。
      # runner 镜像不再自带 Inno Setup（2025-09 起移除），而且
      # resources/win/ChineseSimplified.isl 要求 6.5.0+，所以自己探测并保证版本。
      #
      # 版本必须从**注册表**读：ISCC.exe 是 GUI 子系统程序，`ISCC /?` 不写 stdout，
      # 用 `& $iscc /?` 捕获输出只会拿到空串。
      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = ((Get-Content VERSION -First 1).Trim() -replace '^[vV]', '')
          $src = Join-Path $env:GITHUB_WORKSPACE "dist\circuit-master-$ver-windows-${{ matrix.arch }}"
          $out = Join-Path $env:GITHUB_WORKSPACE 'dist'
          if (-not (Test-Path $src)) { throw "staging tree not found: $src" }

          function Find-IsccInstall {
            $roots = @(
              'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
              'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
            )
            foreach ($root in $roots) {
              $entries = Get-ItemProperty $root -ErrorAction SilentlyContinue |
                         Where-Object { $_.DisplayName -like 'Inno Setup*' }
              foreach ($entry in $entries) {
                if ($entry.InstallLocation) {
                  $candidate = Join-Path $entry.InstallLocation 'ISCC.exe'
                  if (Test-Path $candidate) {
                    # DisplayVersion 不保证是干净的 x.y.z，转 [version] 要防抛异常
                    $parsed = $null
                    if ($entry.DisplayVersion) {
                      [void] [version]::TryParse($entry.DisplayVersion, [ref] $parsed)
                    }
                    return [pscustomobject]@{ Path = $candidate; Version = $parsed }
                  }
                }
              }
            }
            return $null
          }

          # 兜底：按路径找 ISCC.exe，版本从 exe 的文件版本读
          function Find-IsccByPath {
            $candidates = @()
            $onPath = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
            if ($onPath) { $candidates += $onPath }
            if ($env:ChocolateyInstall) { $candidates += "$env:ChocolateyInstall\bin\ISCC.exe" }
            foreach ($base in @($env:ProgramFiles, ${env:ProgramFiles(x86)})) {
              if (-not $base -or -not (Test-Path $base)) { continue }
              $hit = Get-ChildItem -Path $base -Filter 'ISCC.exe' -Recurse -Depth 3 `
                                   -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($hit) { $candidates += $hit.FullName }
            }
            foreach ($candidate in $candidates) {
              if (-not (Test-Path $candidate)) { continue }
              $fileVersion = $null
              try {
                $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($candidate)
                if ($info.FileVersion) {
                  $parsed = $null
                  if ([version]::TryParse($info.FileVersion, [ref] $parsed)) { $fileVersion = $parsed }
                }
              } catch { }
              return [pscustomobject]@{ Path = $candidate; Version = $fileVersion }
            }
            return $null
          }

          $minVersion = [version] '6.5.0'
          $found = Find-IsccInstall
          if (-not $found) { $found = Find-IsccByPath }
          Write-Host "ISCC probe: $(if ($found) { $found.Path } else { 'not found' }), version $(if ($found -and $found.Version) { $found.Version } else { 'unknown' })"

          if (-not $found -or -not $found.Version -or $found.Version -lt $minVersion) {
            Write-Host 'Installing/upgrading Inno Setup 6…'
            # runner 上 choco 是预装的；万一没有，给一句人话而不是 CommandNotFound
            if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
              throw 'Inno Setup is missing and Chocolatey is unavailable; install Inno Setup 6.5+ or put ISCC.exe on PATH.'
            }
            # 已装但版本过低时 choco 会拒绝重装，所以要 --force
            choco install innosetup -y --no-progress --force
            # 1641/3010 = 装好了但需要重启，不算失败
            if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 1641 -and $LASTEXITCODE -ne 3010) {
              throw "choco install innosetup failed with exit code $LASTEXITCODE"
            }
            $found = Find-IsccInstall
            if (-not $found) { $found = Find-IsccByPath }
          }

          if (-not $found) { throw 'ISCC.exe not found (registry, PATH and Program Files all missed).' }
          # 版本未知时不阻断：能跑就行，这个检查只用来拦「明确过低」
          if ($found.Version -and $found.Version -lt $minVersion) {
            throw "ISCC $($found.Version) is older than the required $minVersion (ChineseSimplified.isl needs 6.5.0+)."
          }
          Write-Host "Using ISCC: $($found.Path)"

          & $found.Path "/DMyAppVersion=$ver" `
                  "/DMyArch=${{ matrix.arch }}" `
                  "/DMyArchAllowed=${{ matrix.arch_allowed }}" `
                  "/DMySourceDir=$src" `
                  "/DMyOutputDir=$out" `
                  "/DMyRepoRoot=$env:GITHUB_WORKSPACE" `
                  "/DMyChineseIsl=$env:GITHUB_WORKSPACE\resources\win\ChineseSimplified.isl" `
                  "/DMyIconFile=$env:GITHUB_WORKSPACE\resources\win\circuit-master.ico" `
                  'resources\win\circuit-master.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

          # 产物名由 .iss 的 OutputBaseFilename 决定，这里按同一个规则断言，
          # 免得命名漂移后 create-release 的 *-setup.exe 匹配不到
          $setup = Join-Path $out "circuit-master-$ver-windows-${{ matrix.arch }}-setup.exe"
          if (-not (Test-Path $setup)) { throw "expected installer was not produced: $setup" }

          # 主程序 + Qt 运行时压完至少是 MB 级；只有几百 KB 说明 [Files] 没真正打进去
          $len = (Get-Item $setup).Length
          Write-Host ("installer: {0} ({1:N1} MiB)" -f $setup, ($len / 1MB))
          if ($len -lt 5MB) { throw "installer looks too small ($len bytes); check the [Files] source tree" }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}_windows_${{ matrix.arch }}_setup
          path: dist/*-setup.exe
          if-no-files-found: error

  # macOS 包：一个 .dmg，里面是 CircuitMaster.app（已用 macdeployqt 带上 Qt 框架）。
  # hdiutil 是系统自带工具，不需要额外安装；挂载后把 .app 拖进「应用程序」即可。
  build-macos:
    name: Package (macOS ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            arch: arm64
          - os: macos-26-intel
            arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Qt
        run: |
          brew install qt
          prefix="$(brew --prefix qt)"
          echo "QT_PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "$prefix/bin" >> "$GITHUB_PATH"

      - name: Verify Qt version
        run: |
          if command -v qmake >/dev/null 2>&1; then
            version="$(qmake -query QT_VERSION)"
          else
            version="$(qmake6 -query QT_VERSION)"
          fi
          echo "Qt $version（$QT_PREFIX）"
          major=${version%%.*}
          rest=${version#*.}
          minor=${rest%%.*}
          if [ "$major" -lt 6 ] || { [ "$major" -eq 6 ] && [ "$minor" -lt 5 ]; }; then
            echo "::error::Qt >= 6.5 is required, found $version."
            exit 1
          fi

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCSM_BUILD_TESTS=OFF
          -DCMAKE_PREFIX_PATH="$QT_PREFIX"

      - name: Build
        run: cmake --build build --parallel

      - name: Verify the produced bundle
        run: |
          set -euo pipefail
          exe="build/CircuitMaster.app/Contents/MacOS/CircuitMaster"
          if [ ! -x "$exe" ]; then
            echo "::error::$exe was not produced"
            find build -maxdepth 4 -name 'CircuitMaster*' -print
            exit 1
          fi
          # 版本号来自根目录 VERSION，产物上对一下（不一致说明 CMake 没重新配置）
          "$exe" --version

          # Info.plist 里的版本号也要跟上，否则「关于」与 Finder 里显示的是旧版本
          plist="build/CircuitMaster.app/Contents/Info.plist"
          if [ -f "$plist" ]; then
            /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist" || true
          fi

      - name: Stage the package
        run: |
          set -euo pipefail
          version=$(sed 's/^[vV]//' VERSION | tr -d '[:space:]')
          # 架构来自 matrix（macos-26 → arm64、macos-26-intel → x64），
          # 不靠 uname 猜：两者必须一致，否则包名会与 runner 对不上
          arch="${{ matrix.arch }}"
          actual="$(uname -m)"
          case "$arch:$actual" in
            arm64:arm64|x64:x86_64) ;;
            *)
              echo "::error::matrix arch is $arch but the runner reports $actual"
              exit 1
              ;;
          esac
          stage="dist/circuit-master-${version}-macos-${arch}"
          mkdir -p "$stage"

          cp -R build/CircuitMaster.app "$stage/"
          cp README.md "$stage/README.md"
          cp CHANGELOG.md "$stage/CHANGELOG.md"
          cp LICENSE "$stage/LICENSE"

          echo "STAGE=$stage" >> "$GITHUB_ENV"
          echo "PKG_VERSION=$version" >> "$GITHUB_ENV"
          echo "PKG_ARCH=$arch" >> "$GITHUB_ENV"

      # macdeployqt 把 Qt 框架与插件拷进 .app 内部，并改好 rpath；
      # 目标机没装 Qt 也能双击运行。--no-codesign 跳过签名（CI 没有证书），
      # 代价是首次打开要右键「打开」，这一点写进 README 的安装说明里。
      - name: Deploy the Qt runtime (macdeployqt)
        run: |
          set -euo pipefail
          deploy=$(ls "$QT_PREFIX"/bin/macdeployqt 2>/dev/null | head -1)
          if [ -z "$deploy" ]; then
            deploy=$(find "$QT_PREFIX" -maxdepth 3 -name macdeployqt | head -1)
          fi
          if [ -z "$deploy" ]; then
            echo "::error::macdeployqt not found under $QT_PREFIX"
            exit 1
          fi
          echo "using $deploy"

          "$deploy" "$STAGE/CircuitMaster.app" -no-codesign

          # 翻译不靠 macdeployqt：它只搬 Qt 库与插件。中文翻译包里的
          # qtbase_zh_CN.qm 要自己放进 Contents/translations ——
          # 程序启动时会到那里找（见 ui/I18n.cpp）
          qm=""
          for candidate in \
            "$QT_PREFIX/share/qt6/translations/qtbase_zh_CN.qm" \
            "$QT_PREFIX/share/qt/translations/qtbase_zh_CN.qm" \
            "$("$QT_PREFIX/bin/qmake" -query QT_INSTALL_TRANSLATIONS 2>/dev/null)/qtbase_zh_CN.qm"; do
            if [ -f "$candidate" ]; then
              qm="$candidate"
              break
            fi
          done
          if [ -z "$qm" ]; then
            echo "::warning::qtbase_zh_CN.qm not found; the UI will fall back to English standard widgets"
          else
            echo "using $qm"
            mkdir -p "$STAGE/CircuitMaster.app/Contents/translations"
            cp "$qm" "$STAGE/CircuitMaster.app/Contents/translations/"
          fi

      # 部署完再查一遍：.app 里必须真的有 QtCore，否则解压到目标机就是闪退
      - name: Verify the deployed bundle
        run: |
          set -euo pipefail
          app="$STAGE/CircuitMaster.app"
          frameworks="$app/Contents/Frameworks"
          if [ ! -d "$frameworks" ]; then
            echo "::error::$frameworks is missing; macdeployqt did not run"
            exit 1
          fi
          for lib in QtCore QtGui QtWidgets QtCharts QtSvg QtNetwork; do
            if ! ls "$frameworks" | grep -q "^${lib}"; then
              echo "::error::$lib.framework is missing from the bundle"
              ls "$frameworks"
              exit 1
            fi
          done
          echo "frameworks:"
          ls "$frameworks"
          echo "bundle size: $(du -sh "$app" | cut -f1)"

      # 只出 .dmg：macOS 用户的习惯做法是挂载后把 .app 拖进「应用程序」。
      # hdiutil 是系统自带的，不需要额外装工具；UDZO 是压缩的只读镜像。
      # 不加 --internet-enable（已废弃）也不做签名 —— CI 没有证书，
      # 代价是首次打开要右键「打开」，这一点写进 README 的安装说明。
      - name: Pack the dmg
        run: |
          set -euo pipefail
          name="circuit-master-${PKG_VERSION}-macos-${PKG_ARCH}.dmg"
          rm -f "dist/${name}"

          hdiutil create \
            -volname "CircuitMaster ${PKG_VERSION}" \
            -srcfolder "$STAGE" \
            -fs HFS+ \
            -format UDZO \
            -ov \
            "dist/${name}"

          ls -lh "dist/${name}"
          if [ "$(stat -f%z "dist/${name}")" -lt 5242880 ]; then
            echo "::error::the dmg looks too small; Qt frameworks were probably not deployed"
            exit 1
          fi

          # 挂起来再看一眼：镜像里必须真有 .app，否则发出去的是个空壳
          mountpoint=$(mktemp -d)
          hdiutil attach "dist/${name}" -mountpoint "$mountpoint" -nobrowse -readonly >/dev/null
          if [ ! -d "$mountpoint/CircuitMaster.app" ]; then
            echo "::error::CircuitMaster.app is missing from the dmg"
            ls -la "$mountpoint"
            hdiutil detach "$mountpoint" || true
            exit 1
          fi
          echo "dmg contents:"
          ls -1 "$mountpoint"
          hdiutil detach "$mountpoint" >/dev/null

      - name: Upload macOS dmg
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}_macos_${{ matrix.arch }}_dmg
          path: dist/*-macos-*.dmg
          if-no-files-found: error

  # Android：只出 arm64-v8a 的 APK。侧载分发，不走应用商店。
  # 打包链和 build.yaml 里的 Build (Android) 一样，区别是这里产物要落到
  # dist/ 并按「<名字>-<版本>-android-arm64.apk」命名 —— 客户端的更新器
  # 就是按这个后缀挑包的（见 UpdateChecker::suffixFor）。
  build-android:
    name: Package (Android)
    runs-on: ubuntu-26.04
    continue-on-error: true
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK and NDK
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"

          sdkmanager=$(command -v sdkmanager || true)
          if [ -z "$sdkmanager" ]; then
            sdkmanager=$(find "$sdk" -maxdepth 5 -name sdkmanager -type f -print -quit)
          fi
          if [ -z "$sdkmanager" ]; then
            echo "::error::没有找到 sdkmanager"
            exit 1
          fi

          yes | "$sdkmanager" --licenses > /dev/null || true

          version=26.1.10909125
          if ! "$sdkmanager" --install "ndk;$version" > /dev/null 2>&1; then
            version=$("$sdkmanager" --list 2>/dev/null \
              | sed -n 's/^ *ndk;\(2[67]\.[0-9.]*\).*/\1/p' | sort -V | tail -1)
            if [ -z "$version" ]; then
              echo "::error::仓库里找不到可用的 NDK"
              exit 1
            fi
            "$sdkmanager" --install "ndk;$version" > /dev/null
          fi
          echo "ANDROID_NDK_ROOT=$sdk/ndk/$version" >> "$GITHUB_ENV"

          # 平台固定 34：androiddeployqt 会挑 SDK 里最高的平台，而镜像里带有
          # android-36-ext19 这类预览版，它的 android.jar 资源表 Qt 6.7 的
          # aapt2 读不了（RES_TABLE_TYPE_TYPE entry offsets overlap）
          "$sdkmanager" --install "platforms;android-34" > /dev/null
          find "$sdk/platforms" -mindepth 1 -maxdepth 1 -type d \
            \( -name 'android-3[5-9]*' -o -name '*-ext*' -o -name '*-preview*' \) \
            -exec rm -rf {} +

      - name: Install Qt for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: linux
          target: android
          arch: android_arm64_v8a
          modules: 'qtcharts'
          cache: true

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build

      - name: Configure
        run: |
          set -euo pipefail
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build-android -G Ninja -Wno-deprecated \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-23 \
            -DCSM_BUILD_TESTS=OFF

      - name: Build the APK
        run: |
          set -euo pipefail
          cmake --build build-android --parallel
          cmake --build build-android --target apk --parallel

      - name: Stage the package
        run: |
          set -euo pipefail
          version=$(sed 's/^[vV]//' VERSION | tr -d '[:space:]')
          mkdir -p dist

          # apk 目标产出的名字是 CircuitMaster.apk，按发布命名规则改掉
          src=$(find build-android -name '*.apk' -print -quit)
          if [ -z "$src" ]; then
            echo "::error::no APK was produced"
            exit 1
          fi
          name="circuit-master-${version}-android-arm64.apk"
          cp "$src" "dist/$name"
          ls -lh "dist/$name"
          # 和 Windows / macOS 一样卡一下体积：太小说明没把 Qt 库打进去
          if [ "$(stat -c%s "dist/$name")" -lt 10485760 ]; then
            echo "::error::APK is suspiciously small"
            exit 1
          fi

      # 签名。release 构建默认出的是**未签名** APK，Android 会直接拒绝安装
      #（"该安装包未包含任何证书"）。这里用仓库里的 sideLoad 密钥签：
      #   resources/android/sideload.keystore，别名 circuit-master
      # 口令写在下面 —— 这把密钥是**公开**的，只适合自发分发（侧载）：
      # 谁拿到仓库都能用同一身份签名。要正式分发请换成自己的密钥，
      # 并用 secrets 传进来（改了密钥之后用户需要卸载重装一次）。
      - name: Sign the APK
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          tools=$(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          zipalign="$tools/zipalign"
          apksigner="$tools/apksigner"
          if [ ! -x "$apksigner" ]; then
            echo "::error::apksigner not found under $tools"
            exit 1
          fi

          keystore=resources/android/sideload.keystore
          pass=circuitmaster
          alias=circuit-master

          for apk in dist/*.apk; do
            base="${apk%.apk}"
            # 先对齐再签名：zipalign 必须在校名前做，apksigner 之后不能再改文件
            "$zipalign" -p -f 4 "$apk" "${base}.aligned.apk"
            rm -f "$apk"
            "$apksigner" sign --ks "$keystore" --ks-pass "pass:$pass" \
              --ks-key-alias "$alias" --key-pass "pass:$pass" \
              --out "$apk" "${base}.aligned.apk"
            rm -f "${base}.aligned.apk"
            "$apksigner" verify --print-certs "$apk"
          done
          ls -lh dist/*.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 7

  create-release:
    name: Publish release
    runs-on: ubuntu-26.04
    needs: [build-deb, build-windows, build-macos, build-android]
    # PR 只验证各平台能不能打包（Linux amd64/arm64/loong64/riscv64 + Windows x64/arm64
    # + macOS arm64），不建 Release
    if: github.event_name != 'pull_request'

    # 所有分支 / 标签的发布都会去删改同一个 continuous_build tag，
    # 顶层并发组是按 ref 分的，挡不住两个分支同时发版，这里再串行一次。
    concurrency:
      group: release-publish
      cancel-in-progress: false

    steps:
      # 发布说明来自仓库根目录的 VERSION 与 CHANGELOG.md，必须先检出代码。
      - name: Checkout (to read VERSION / CHANGELOG.md)
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute SHA-256 checksums
        run: |
          cd artifacts
          > hashes.sha256
          # 格式统一为「哈希 *文件名」，Linux 侧可直接 sha256sum -c 校验
          for file in $(find . -type f \( -name "*.deb" -o -name "*.tar.gz" -o -name "*.zip" -o -name "*-setup.exe" -o -name "*.dmg" -o -name "*.apk" \)); do
            filename=$(basename "$file")
            sha256sum "$file" | awk -v fname="$filename" '{print $1 " *" fname}' >> hashes.sha256
          done
          cd ..
          tree artifacts || find artifacts -type f -printf '%p %s bytes\n'

      # 发布说明的来源：
      #   正式版（打 tag）→ CHANGELOG.md 里对应版本那一节，原样作为 Release 正文；
      #                   找不到就失败，避免悄悄发出一版没有更新日志的 Release。
      #   持续构建       → 一小段说明 + 指向 CHANGELOG.md，不占用版本节。
      - name: Prepare release metadata
        run: |
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          : > "$NOTES_FILE"

          if [ "${{ github.ref_type }}" == "tag" ]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"                     # v0.1.0 → 0.1.0

            for f in VERSION CHANGELOG.md; do
              if [ ! -f "$f" ]; then
                echo "::error::$f is missing from the repository root; cannot generate release notes (check that checkout ran)"
                exit 1
              fi
            done

            FILE_VERSION="$(sed 's/^[vV]//' VERSION | tr -d '[:space:]')"

            # 发布前先对账：tag 和 VERSION 必须是同一个版本，否则会出现
            # 「tag 是 v0.1.1、deb 却叫 0.1.0」这种装上去还显示旧版本的情况
            if [ "$VERSION" != "$FILE_VERSION" ]; then
              echo "::error::Tag ($TAG) does not match VERSION ($(cat VERSION)); set VERSION to v$VERSION before tagging"
              exit 1
            fi

            echo "PRERELEASE=" >> $GITHUB_ENV
            echo "RELEASE_NAME=${{ env.APP_NAME }} $TAG" >> $GITHUB_ENV
            echo "TAG_NAME=$TAG" >> $GITHUB_ENV

            # 取 "## [<版本>]" 到下一个 "## [" 之间的内容，并去掉首尾空行。
            # 小节标题按 tag 写法带 v（## [v0.1.0]），这里 v 前缀可有可无，
            # 免得 VERSION / CHANGELOG 的写法互换时匹配不到。
            awk -v ver="$VERSION" '
              $0 ~ "^## \\[v?" ver "\\]" { inside = 1; next }
              inside && /^## \[/ { exit }
              inside { lines[++n] = $0 }
              END {
                first = 1
                while (first <= n && lines[first] ~ /^[[:space:]]*$/) first++
                while (n >= first && lines[n] ~ /^[[:space:]]*$/) n--
                for (i = first; i <= n; ++i) print lines[i]
              }
            ' CHANGELOG.md > "$NOTES_FILE"
          else
            echo "PRERELEASE=-p" >> $GITHUB_ENV
            echo "RELEASE_NAME=Continuous build" >> $GITHUB_ENV
            echo "TAG_NAME=continuous_build" >> $GITHUB_ENV

            {
              echo "Generated automatically by CI for commit [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})."
              echo
              echo "See [\`CHANGELOG.md\`](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/CHANGELOG.md) at the repository root for the full changelog."
            } > "$NOTES_FILE"
          fi

          # 正式版必须带更新日志：宁可让 job 失败，也不要发出一版没有说明的 Release
          if [ ! -s "$NOTES_FILE" ]; then
            if [ "${{ github.ref_type }}" == "tag" ]; then
              echo "::error::CHANGELOG.md has no ## [v$VERSION] (or ## [$VERSION]) section; add one before releasing"
            else
              echo "::error::Release notes are empty"
            fi
            exit 1
          fi

          echo "Release body: using $NOTES_FILE ($(wc -l < "$NOTES_FILE") lines)"

      # 更新检查读的是这个文件，不是 API 也不是 Atom：
      #   https://github.com/<repo>/releases/latest/download/latest.json
      # 它是 Release 的一个普通资产，CDN 直出、不占 API 配额，第三方 GitHub
      # 转发服务也能原样代理 —— 客户端因此不必先连上 github.com 才能查版本。
      # 内容与 Release 正文同源（同一份 NOTES_FILE），只是包成 JSON 好解析。
      # 持续构建不发这个文件：/releases/latest 本来就跳过预发布。
      - name: Generate update manifest
        if: github.ref_type == 'tag'
        run: |
          python3 - "$RUNNER_TEMP/release-notes.md" "$RUNNER_TEMP/latest.json" <<'PY'
          import json, os, sys
          from datetime import datetime, timezone

          notes_path, out_path = sys.argv[1], sys.argv[2]
          tag = os.environ["TAG_NAME"]
          version = tag[1:] if tag[:1] in ("v", "V") else tag
          repo = os.environ["GITHUB_REPOSITORY"]
          app = os.environ.get("APP_NAME", "circuit-master")

          with open(notes_path, encoding="utf-8") as handle:
              notes = handle.read()

          # 资产清单：客户端据此挑出当前平台该下的包，直接下载而不必打开网页。
          # 名字与 Release 资产一致，URL 用 /releases/download/<tag>/<file> 拼出来。
          assets = []
          for root, _dirs, files in os.walk("artifacts"):
              for name in sorted(files):
                  if not name.endswith((".deb", ".tar.gz", ".zip", "-setup.exe", ".dmg", ".apk")):
                      continue
                  if name.endswith((".sha256", ".dbgsym.deb", ".build-deps.deb")):
                      continue
                  full = os.path.join(root, name)
                  assets.append({
                      "name": name,
                      "size": os.path.getsize(full),
                      "url": f"https://github.com/{repo}/releases/download/{tag}/{name}",
                  })

          manifest = {
              "version": version,
              "tag": tag,
              "name": f"{app} {tag}",
              "page": f"https://github.com/{repo}/releases/tag/{tag}",
              "notes": notes,
              "published_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "assets": assets,
          }
          with open(out_path, "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, ensure_ascii=False, indent=2)
          PY

          # 客户端解析不了坏 JSON 就只会报错，但不该让坏文件上线
          python3 -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8'))" \
            "$RUNNER_TEMP/latest.json"
          echo "Manifest: $(wc -c < "$RUNNER_TEMP/latest.json") bytes"
          head -c 400 "$RUNNER_TEMP/latest.json"

      - name: Create GitHub Release
        continue-on-error: false
        run: |
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          deb_files=$(find artifacts -name "*.deb" -print0 | xargs -0 echo)
          tar_files=$(find artifacts -name "*.tar.gz" -print0 | xargs -0 echo)
          zip_files=$(find artifacts -name "*.zip" -print0 | xargs -0 echo)
          setup_files=$(find artifacts -name "*-setup.exe" -print0 | xargs -0 echo)
          dmg_files=$(find artifacts -name "*-macos-*.dmg" -print0 | xargs -0 echo)
          hash_files=$(find artifacts -name "*.sha256" -print0 | xargs -0 echo)

          if [ -z "$deb_files" ]; then
            echo "::error::No deb artifacts were produced; aborting the release."
            exit 1
          fi

          # Linux 便携包缺某个架构时不拦发布：deb 已经能装，tar.gz 只是方便解压即用
          if [ -z "$tar_files" ]; then
            echo "::warning::No Linux tarball was produced; publishing deb packages only."
          else
            for deb in $deb_files; do
              arch=$(basename "$deb" .deb | cut -d_ -f3)
              if ! find artifacts -name "*-linux-${arch}.tar.gz" | grep -q .; then
                echo "::warning::Linux tarball for $arch is missing; only its deb is published."
              fi
            done
          fi

          # Windows 产物缺失时的策略：
          #   正式版（打 tag）—— 一条 Release 不该少掉整个 Windows 平台，直接失败；
          #   持续构建        —— 只是验证当前提交能不能出包，宁可只发 Linux，
          #                      也不让 Windows 打包的一次失败堵住整条流水线。
          # 逐架构点名，才能区分「少了一个架构」和「一个架构都没有」
          zip_x64=$(find artifacts -name "*windows-x64.zip" -print0 | xargs -0 echo)
          zip_arm64=$(find artifacts -name "*windows-arm64.zip" -print0 | xargs -0 echo)
          setup_x64=$(find artifacts -name "*windows-x64-setup.exe" -print0 | xargs -0 echo)
          setup_arm64=$(find artifacts -name "*windows-arm64-setup.exe" -print0 | xargs -0 echo)

          # Windows 产物缺失时的策略，按缺到什么程度分三档：
          #   连 x64 包都没有
          #     · 正式版（打 tag）—— 一条 Release 不该少掉整个 Windows 平台，
          #                          直接失败；否则「正式版少一个平台」没人察觉；
          #     · 持续构建        —— 只是验证当前提交能不能出包，宁可只发 Linux，
          #                          也不让 Windows 打包的一次失败堵住整条流水线。
          #   少了 arm64 包
          #     · 一律 warning：ARM64 是次要平台，而且 ARM 版 Windows 能模拟跑
          #       x64 包，缺它不等于平台缺失；ARM runner 抖动不该卡住发版。
          #   少了安装包（zip 在、setup.exe 不在）
          #     · 一律 warning：便携包解压即用，平台本身是完整的；
          #       不该因为 choco / ISCC 的一次抖动就整条 Release 发不出去。
          if [ -z "$zip_x64" ]; then
            if [ "${{ github.ref_type }}" == "tag" ]; then
              echo "::error::The Windows x64 package is missing from a tagged release; check the 'Package (Windows x64)' job."
              exit 1
            else
              echo "::warning::The Windows x64 package is missing; publishing deb packages only."
            fi
          fi
          if [ -n "$zip_x64" ] && [ -z "$zip_arm64" ]; then
            echo "::warning::The Windows arm64 package is missing; only x64 is published for Windows."
          fi
          if [ -n "$zip_x64" ] && [ -z "$setup_x64" ]; then
            echo "::warning::The Windows x64 installer (setup.exe) is missing; the portable zip is still published."
          fi
          if [ -n "$zip_arm64" ] && [ -z "$setup_arm64" ]; then
            echo "::warning::The Windows arm64 installer (setup.exe) is missing; the portable zip is still published."
          fi

          # macOS 产物缺失时与 Windows 同样的策略：正式版必须带，持续构建只警告。
          # 一个 zip 就是整个 macOS 平台（里面是 .app），没有安装包/便携包之分。
          if [ -z "$dmg_files" ]; then
            if [ "${{ github.ref_type }}" == "tag" ]; then
              echo "::error::The macOS package is missing from a tagged release; check the 'Package (macOS)' job."
              exit 1
            else
              echo "::warning::The macOS package is missing; publishing the other platforms only."
            fi
          fi

          # Android 的 APK 只在**持续构建（预发布）**里带上，正式版（tag）不带 ——
          # Android 还没成熟，等稳定之后再随正式版发布。作业照常跑，只是这里不收集。
          apk_files=""
          if [ "${{ github.ref_type }}" != "tag" ]; then
            apk_files=$(find artifacts -name "*-android-arm64.apk" -print0 | xargs -0 echo)
            if [ -z "$apk_files" ]; then
              echo "::warning::The Android APK is missing from the continuous build."
            fi
          else
            echo "正式版不带 Android APK（还没成熟），跳过"
          fi

          # 清单只有正式版才生成；持续构建时为空，展开成空参数不影响命令
          manifest_file=""
          if [ -f "$RUNNER_TEMP/latest.json" ]; then
            manifest_file="$RUNNER_TEMP/latest.json"
          fi

          # 同名 release 已存在就先删掉（continuous_build 连带删 tag）
          if gh release view ${{ env.TAG_NAME }} --repo $GITHUB_REPOSITORY &> /dev/null; then
            if [ "${{ env.TAG_NAME }}" == "continuous_build" ]; then
              gh release delete ${{ env.TAG_NAME }} --repo $GITHUB_REPOSITORY --cleanup-tag --yes
            else
              gh release delete ${{ env.TAG_NAME }} --repo $GITHUB_REPOSITORY --yes
            fi
            echo "Deleted ${{ env.TAG_NAME }}"
          fi

          gh release create ${{ env.TAG_NAME }} \
                            $deb_files \
                            $tar_files \
                            $zip_files \
                            $setup_files \
                            $dmg_files \
                            $apk_files \
                            $hash_files \
                            $manifest_file \
                            ${{ env.PRERELEASE }} \
                            --repo $GITHUB_REPOSITORY \
                            --title "${{ env.RELEASE_NAME }}" \
                            --notes-file "$NOTES_FILE"

          echo "Created release: ${{ env.TAG_NAME }}"
          echo "Artifacts:"
          echo "$deb_files"
          echo "$tar_files"
          echo "$zip_files"
          echo "$setup_files"
          echo "$dmg_files"
          echo "$apk_files"
          echo "$hash_files"
          echo "$manifest_file"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
