name: 功能建议
description: 希望增加或改进的元件、分析类型、界面操作
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        本项目的目标是做 Multisim 在 Linux 上的替代方案。
        描述需求时如果能说清「用来做什么电路、现在怎么绕过去」，会更容易排优先级。

  - type: textarea
    id: goal
    attributes:
      label: 想解决什么问题
      description: 你正在做什么电路，卡在哪一步
      placeholder: 想做开关电源的环路分析，现在只能手工扫频……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 希望怎么做
      description: 界面在哪里、怎么操作；如果参照别的软件，写清是哪个软件
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 涉及的部分
      multiple: true
      options:
        - 元件库（新增元件）
        - 仿真引擎（分析类型、模型）
        - 波形监控 / 示波器
        - 原理图编辑（连线、对齐、快捷键）
        - 测量（测试点、万用表、探针）
        - 打包与安装
        - 其它

  - type: textarea
    id: alternatives
    attributes:
      label: 现在怎么绕过
      description: 现有的替代做法，或者别的软件里的对应功能
    validations:
      required: false
